# ==============================================================================
# DeepTrustShield - Podman Compose
# ==============================================================================
# Arquivo otimizado para uso com Podman e podman-compose
# Uso: podman-compose up -d
# ==============================================================================

version: '3.8'

services:
  # Redis para fila de jobs
  redis:
    image: docker.io/redis:7-alpine
    container_name: deeptrust-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend FastAPI
  backend:
    image: ${REGISTRY:-localhost}/deeptrust-backend:${TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deeptrust-backend
    environment:
      - DATABASE_URL=sqlite:////app/data/detectar.db
      - REDIS_URL=redis://redis:6379/0
      - ARTIFACTS_PATH=/app/artifacts
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80
    volumes:
      - artifacts_data:/app/artifacts
      - db_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Worker para processamento de IA
  worker:
    image: ${REGISTRY:-localhost}/deeptrust-worker:${TAG:-latest}
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: deeptrust-worker
    environment:
      - DATABASE_URL=sqlite:////app/data/detectar.db
      - REDIS_URL=redis://redis:6379/0
      - ARTIFACTS_PATH=/app/artifacts
      - MODEL_PATH=/app/model/weights
    volumes:
      - artifacts_data:/app/artifacts
      - db_data:/app/data
      - ./model/weights:/app/model/weights:ro
      # Montar modelos da raiz se existirem
      - ./best_model_efficientnet_b0.pth:/app/model/weights/best_model_efficientnet_b0.pth:ro
      - ./best_model_efficientnet_b3.pth:/app/model/weights/best_model_efficientnet_b3.pth:ro
      - ./best_model_efficientnet_b4.pth:/app/model/weights/best_model_efficientnet_b4.pth:ro
      - ./final_model_efficientnet_b0_v4.pth:/app/model/weights/final_model_efficientnet_b0_v4.pth:ro
      - ./efficientnet_b0_deepfake_v5.pth:/app/model/weights/efficientnet_b0_deepfake_v5.pth:ro
      - ./alexnet_deepfake_v6.pth:/app/model/weights/alexnet_deepfake_v6.pth:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Frontend React (Nginx)
  frontend:
    image: ${REGISTRY:-localhost}/deeptrust-frontend:${TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deeptrust-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
    driver: local
  artifacts_data:
    driver: local
  db_data:
    driver: local

# Rede padrão
networks:
  default:
    name: deeptrust-network
